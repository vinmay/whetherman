[project]
name = "whetherman"
version = "0.1.0"
description = "A 270M model that forecasts whether your AI agent actually needs to call a tool."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "vinmay" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5",
    "transformers>=4.57",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=1.0",
]
eval = ["matplotlib>=3.9", "scipy>=1.13"]

[project.scripts]
whetherman = "whetherman.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"data/e3/build_e3.py" = ["E501"]
